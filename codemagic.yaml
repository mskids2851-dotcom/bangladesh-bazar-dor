workflows:
  android-workflow:
    name: Bangladesh Bazar Dor Android
    max_build_duration: 60
    environment:
      node: 20
    scripts:
      - name: Build everything
        script: |
          cd artifacts/bangladesh-bazar-dor
          npm install
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - artifacts/bangladesh-bazar-dor/android/app/build/outputs/**/*.apk
