workflows:
  android-workflow:
    name: Bangladesh Bazar Dor Android
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      vars:
        NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_AUDIT: "false"
    scripts:
      - name: Build everything
        script: |
          set -e
          rm -f .npmrc artifacts/.npmrc artifacts/bangladesh-bazar-dor/.npmrc
          cd artifacts/bangladesh-bazar-dor
          rm -rf node_modules package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund --loglevel=error --registry=https://registry.npmjs.org/
          npm run build
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - artifacts/bangladesh-bazar-dor/android/app/build/outputs/**/*.apk
