workflows:
  android-workflow:
    name: Bangladesh Bazar Dor Android
    max_build_duration: 60
    environment:
      node: 22
      vars:
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_UPDATE_NOTIFIER: "false"
    scripts:
      - name: Build everything
        script: |
          set -e
          cd artifacts/bangladesh-bazar-dor
          npm install -g npm@11
          npm install --no-audit --no-fund --loglevel=error
          npm run build
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - artifacts/bangladesh-bazar-dor/android/app/build/outputs/**/*.apk
